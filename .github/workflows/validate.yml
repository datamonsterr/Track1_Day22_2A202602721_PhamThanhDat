name: Validate Day22 submission

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit, integration and artifact contract tests
        run: python -m pytest -q
      - name: Validate committed workbook and documents
        run: python scripts/validate_model.py
      - name: Ensure validation leaves committed deliverables untouched
        run: git diff --exit-code
